version: '3.8'

services:
  # ===========================================
  # 待办事项应用
  # ===========================================
  todo-app:
    build: .
    ports:
      - "127.0.0.1:5000:5000"  # 仅本地访问，通过 Nginx 反向代理对外
    environment:
      # ⚠️ 安全提醒：以下密码为默认值，生产环境请通过 .env 文件覆盖
      - DATABASE_URL=${DATABASE_URL:-postgresql://todo_user:todo_password@db:5432/todo_db}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379/0}
      - SECRET_KEY=${SECRET_KEY:-your-secret-key-here}
      - FLASK_ENV=production
      - LOG_LEVEL=INFO
      - LOG_DIR=/app/logs
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - ./logs:/app/logs
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ===========================================
  # PostgreSQL 数据库
  # ===========================================
  db:
    image: postgres:13-alpine
    environment:
      # ⚠️ 安全提醒：以下密码为默认值，生产环境请通过 .env 文件覆盖
      - POSTGRES_DB=${POSTGRES_DB:-todo_db}
      - POSTGRES_USER=${POSTGRES_USER:-todo_user}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-todo_password}
      - POSTGRES_INITDB_ARGS=--encoding=UTF-8 --lc-collate=C --lc-ctype=C
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/01-init.sql
    ports:
      - "127.0.0.1:5432:5432"  # 仅本地访问，不暴露到公网
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U todo_user -d todo_db"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ===========================================
  # Redis 缓存
  # ===========================================
  redis:
    image: redis:6-alpine
    command: redis-server --appendonly yes --maxmemory 64mb --maxmemory-policy allkeys-lru
    ports:
      - "127.0.0.1:6379:6379"  # 仅本地访问，不暴露到公网
    volumes:
      - redis_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ===========================================
  # Nginx 反向代理
  # ===========================================
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - todo-app
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
