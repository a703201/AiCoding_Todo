# ──────────────────────────────────────────────
# Nginx 生产配置
# 功能：反向代理 + 速率限制 + 安全头 + SSL 模板 + 静态资源缓存
# ──────────────────────────────────────────────

# 速率限制区域定义
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=login_limit:10m rate=5r/m;
limit_conn_zone $binary_remote_addr zone=conn_limit:10m;

# 上游服务器定义（IP 哈希保持会话亲和性）
upstream todo_backend {
    ip_hash;
    server todo-app:5000 max_fails=3 fail_timeout=30s;
    keepalive 32;
}

# ── HTTP 主配置 ──
server {
    listen 80;
    server_name _;

    # ── 连接限制 ──
    limit_conn conn_limit 20;
    limit_conn_status 429;

    # ── 安全头 ──
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # ── 隐藏版本号 ──
    server_tokens off;

    # ── 请求体大小限制 ──
    client_max_body_size 1m;
    client_body_buffer_size 128k;

    # ── 超时配置 ──
    client_header_timeout 10s;
    client_body_timeout 10s;
    send_timeout 10s;

    # ── 日志 ──
    access_log /var/log/nginx/todo_access.log;
    error_log  /var/log/nginx/todo_error.log warn;

    # ── Gzip 压缩 ──
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml+rss
        application/rss+xml
        application/atom+xml
        image/svg+xml;

    # ════════════════════════════════════════
    # 健康检查端点（不限速）
    # ════════════════════════════════════════
    location /health {
        proxy_pass http://todo_backend/health;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # 健康检查不记录日志
        access_log off;
    }

    # ════════════════════════════════════════
    # API 路由（速率限制）
    # ════════════════════════════════════════
    location /api/ {
        # 速率限制：每秒 10 个请求，突发 20
        limit_req zone=api_limit burst=20 nodelay;
        limit_req_status 429;

        proxy_pass http://todo_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 超时
        proxy_connect_timeout 10s;
        proxy_read_timeout 30s;
        proxy_send_timeout 10s;

        # 缓冲
        proxy_buffering on;
        proxy_buffer_size 4k;
        proxy_buffers 8 4k;
        proxy_busy_buffers_size 8k;

        # API 响应不缓存
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
    }

    # ════════════════════════════════════════
    # 前端页面（限速较宽松）
    # ════════════════════════════════════════
    location / {
        # 速率限制：每秒 20 个请求
        limit_req zone=api_limit burst=30 nodelay;
        limit_req_status 429;

        proxy_pass http://todo_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 10s;
        proxy_read_timeout 30s;
        proxy_send_timeout 10s;
    }

    # ════════════════════════════════════════
    # 错误页面
    # ════════════════════════════════════════
    error_page 429 /429.html;
    error_page 502 503 504 /50x.html;

    location = /429.html {
        default_type application/json;
        return 429 '{"error":"请求过于频繁，请稍后再试","retry_after":1}';
    }

    location = /50x.html {
        default_type application/json;
        return 503 '{"error":"服务暂时不可用，请稍后再试"}';
    }
}

